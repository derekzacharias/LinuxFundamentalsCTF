name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint (bash -n + invariants + shellcheck)
        run: ./scripts/test.sh lint

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lab image
        run: docker build -t linux-ctf-lab .
      - name: Run lab container (systemd)
        run: docker run -d --privileged --name lab linux-ctf-lab
      - name: Wait for systemd
        run: |
          for i in $(seq 1 30); do
            docker exec lab systemctl is-system-running --wait >/dev/null 2>&1 && break
            sleep 3
          done
          docker exec lab systemctl is-system-running || true
      - name: Wait for lesson services
        run: |
          for i in $(seq 1 30); do
            docker exec lab bash -c "systemctl is-active --quiet lesson6-logger lesson12-server lesson23-server" && break
            sleep 3
          done
          docker exec lab bash -c "systemctl is-active lesson6-logger lesson12-server lesson23-server"
      - name: Run all 24 lessons (solvers + validators)
        run: docker exec lab bash -c "cd /opt/LinuxFundamentalsCTF && ./scripts/test.sh --lab student"
      - name: Uninstall check (fresh container, nothing left behind)
        run: |
          docker run -d --privileged --name lab-uninstall linux-ctf-lab
          for i in $(seq 1 30); do
            docker exec lab-uninstall systemctl is-system-running --wait >/dev/null 2>&1 && break
            sleep 3
          done
          docker exec lab-uninstall bash -c "cd /opt/LinuxFundamentalsCTF && ./scripts/test.sh --uninstall"
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs lab --tail 200 || true
          docker logs lab-uninstall --tail 200 || true
